<div class="main-container">

  <header>
    <h1>Pokémon Weather Finder</h1>
  </header>

  <div class="search-box">
    <input [(ngModel)]="city" (keyup.enter)="search()" placeholder="Search for a city...">
    <button (click)="search()">Search</button>
  </div>

  <main class="content-area">

    @if (loading) {
      <div class="loader">Wild Pokémon appearing...</div>
    }

    @if (result && !loading) {
      <div class="pokemon-card">
        <div class="card-header">
          <h2>Currently {{ result.temp }}°C in {{ result.city }}</h2>
          <p>Matching type for this weather: <strong>{{ result.pokemonType | uppercase }}</strong></p>
        </div>

        <div class="pokemon-display">
          <img [src]="'https://img.pokemondb.net/sprites/home/normal/' + result.pokemonName + '.png'"
               [alt]="result.pokemonName">

          <h1 class="pokemon-name">{{ result.pokemonName | uppercase }}</h1>
        </div>
      </div>
    }

  </main>
</div>
